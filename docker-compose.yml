services:
  arquivo:
    build:
      context: .
      args:
        ARCHIVE_PUBLIC: ${ARCHIVE_PUBLIC:-false}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    image: marlene-arquivo
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ARCHIVE_AUTH: ${ARCHIVE_AUTH:-basic}
      ARCHIVE_USER: ${ARCHIVE_USER:-}
      ARCHIVE_PASSWORD: ${ARCHIVE_PASSWORD:-}
